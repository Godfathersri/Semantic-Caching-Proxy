services:
  api:
    build: .
    ports:
      - "8000:8000"

    volumes:
      - ./app:/code/app

    env_file:
      - .env

    environment:
      QDRANT_HOST: qdrant

    depends_on:
      - qdrant

  qdrant:
    image: qdrant/qdrant

    ports:
      - "6333:6333"

    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data: